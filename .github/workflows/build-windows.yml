
name: Build Windows VST3

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target SYNTH_MYASO_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SYNTH-MYASO-Windows-VST3
          path: build/SYNTH_MYASO_artefacts/Release/VST3/
          if-no-files-found: error

